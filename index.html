<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR SASAR SOALAN NEGARAKU 🇲🇾</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <!-- MediaPipe Tasks Vision CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --navy-bg: #050b18;
      --card-bg: rgba(10, 25, 47, 0.85);
      --neon-blue: #00f0ff;
      --neon-red: #ff0055;
      --neon-gold: #ffcc00;
      --neon-green: #00ff66;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--navy-bg);
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Latar Belakang Litar & Grid AR */
    #grid-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at center, rgba(0,240,255,0.05) 0%, transparent 70%),
        linear-gradient(rgba(0,240,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.1) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    /* Container Utama */
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }

    .hidden { display: none !important; }

    /* UI Skrin Utama */
    h1.title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.2rem;
      color: var(--neon-blue);
      text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 1.6rem;
      color: var(--neon-gold);
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .panel {
      background: var(--card-bg);
      border: 2px solid var(--neon-blue);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
      border-radius: 15px;
      padding: 25px;
      width: 90%;
      max-width: 850px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 28px;
      border: 2px solid var(--neon-blue);
      background: rgba(0, 240, 255, 0.1);
      color: var(--white);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0,240,255,0.2);
    }

    .btn:hover:not(:disabled) {
      background: var(--neon-blue);
      color: #000;
      box-shadow: 0 0 25px var(--neon-blue);
    }

    .btn:disabled {
      border-color: #555;
      color: #777;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-gold {
      border-color: var(--neon-gold);
      color: var(--neon-gold);
    }
    .btn-gold:hover:not(:disabled) {
      background: var(--neon-gold);
      color: #000;
      box-shadow: 0 0 25px var(--neon-gold);
    }

    /* Ruang Permainan & Kamera */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #webcam {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Cermin */
      z-index: 2;
    }

    #ar-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      pointer-events: none;
    }

    .interactive-elem { pointer-events: auto; }

    /* Top Bar HUD */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 11, 24, 0.85);
      border: 1px solid var(--neon-blue);
      border-radius: 10px;
      padding: 12px 25px;
    }

    .active-team-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: var(--neon-gold);
      border: 2px solid var(--neon-gold);
      padding: 5px 20px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    /* Kad Soalan Hologram */
    .question-card {
      background: var(--card-bg);
      border: 2px solid var(--neon-blue);
      border-radius: 15px;
      padding: 20px 30px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,240,255,0.3);
    }

    .question-text {
      font-size: 1.8rem;
      line-height: 1.4;
      font-weight: 700;
      color: var(--white);
    }

    /* Pilihan Jawapan AR / Kad Interactive */
    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 800px;
      margin: 15px auto 0 auto;
    }

    .answer-card {
      position: relative;
      background: rgba(10, 25, 47, 0.9);
      border: 2px solid var(--neon-blue);
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 1.4rem;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .answer-card.targeted {
      border-color: var(--neon-gold);
      box-shadow: 0 0 25px var(--neon-gold);
      background: rgba(255, 204, 0, 0.2);
    }

    .answer-card.correct {
      border-color: var(--neon-green) !important;
      background: rgba(0, 255, 102, 0.
